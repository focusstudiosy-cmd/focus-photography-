<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a0307">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus Studio">
<title>Focus Studio — أساسيات التصوير الفوتوغرافي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#BA060B;--red2:#ff3d45;--st:rgba(255,255,255,.2);--mut:rgba(255,255,255,.74)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Tajawal','Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:#fff;
background:radial-gradient(1100px 700px at 15% 10%,#5e050c 0%,transparent 60%),radial-gradient(900px 600px at 90% 95%,#8c0a12 0%,transparent 55%),#0d0507;
display:flex;align-items:center;justify-content:center;overflow:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite alternate;pointer-events:none}
.orb.a{width:380px;height:380px;background:#BA060B;top:-80px;left:-60px}
.orb.b{width:300px;height:300px;background:#ff3d45;bottom:-60px;right:8%;animation-delay:-5s}
.orb.c{width:240px;height:240px;background:#fff;opacity:.12;top:40%;right:-40px;animation-delay:-9s}
@keyframes float{to{transform:translate(40px,-50px) scale(1.15)}}
.side{position:fixed;inset-inline-start:4vw;top:50%;transform:translateY(-50%);width:min(320px,26vw);display:none}
@media(min-width:1100px){.side{display:block}}
.side h2{font-size:30px;margin:14px 0 8px;line-height:1.35}
.side p{color:var(--mut);line-height:1.9}
.side .by{margin-top:18px;padding:12px 14px;border-radius:16px}

.phone{position:relative;width:min(400px,100vw);height:min(850px,calc(100dvh - 30px));border-radius:50px;background:#000;
box-shadow:0 0 0 9px #17171a,0 0 0 11px #3a3a3f,0 40px 120px rgba(186,6,11,.5);overflow:hidden}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:20px;background:#000;z-index:50}
.screen{position:absolute;inset:0;background:linear-gradient(160deg,#42050b 0%,#16060a 52%,#33040a 100%);display:flex;flex-direction:column;overflow:hidden}
.so{position:absolute;border-radius:50%;filter:blur(50px);pointer-events:none;animation:float 12s ease-in-out infinite alternate}
.so.s1{width:230px;height:230px;background:#BA060B;top:60px;right:-70px;opacity:.7}
.so.s2{width:200px;height:200px;background:#ff3d45;bottom:90px;left:-70px;opacity:.45;animation-delay:-4s}
.so.s3{width:140px;height:140px;background:#fff;top:42%;left:35%;opacity:.07;animation-delay:-8s}
.statusbar{height:46px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font:700 13px Arial;direction:ltr;position:relative;z-index:5}
@media(max-width:480px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.island,.statusbar{display:none}.screen{padding-top:env(safe-area-inset-top)}}

.glass{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--st);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.appbar{position:relative;z-index:5;margin:6px 12px 0;border-radius:22px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex:none}
.appbar .ttl{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:flex;align-items:center;direction:ltr;gap:calc(var(--h)*.14)}
.logo .mk{width:var(--h);height:var(--h);flex:none}
.logo .arc{fill:none;stroke:#BA060B;stroke-width:9;stroke-linecap:round}
.logo .hand{fill:none;stroke:#d5d5da;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm b{font:800 calc(var(--h)*.6) 'Helvetica Neue',Arial,sans-serif;color:#BA060B;letter-spacing:-.03em}
.logo .wm small{font:700 calc(var(--h)*.19) Arial;letter-spacing:.55em;color:#BA060B;margin-top:calc(var(--h)*.06)}
.logo.dk .arc{stroke:#ff3d45;filter:drop-shadow(0 0 5px rgba(255,61,69,.7))}
.logo.dk .hand{stroke:#fff;opacity:.85}
.logo.dk .wm b{color:#fff}.logo.dk .wm small{color:#ff7a80}
.logo .arc.draw{stroke-dasharray:170;stroke-dashoffset:170;animation:draw 1.4s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}

#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px 96px;position:relative;z-index:2;scrollbar-width:none;scroll-behavior:smooth}
#view::-webkit-scrollbar{display:none}
.sec{display:none}.sec.on{display:block;animation:in .38s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.tabbar{position:absolute;z-index:10;bottom:12px;left:12px;right:12px;border-radius:26px;display:flex;justify-content:space-around;padding:7px 6px}
.tabbar button{flex:1;background:none;border:0;color:#fff;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:18px;cursor:pointer;transition:.2s}
.tabbar button span{font-size:19px;line-height:1.2}
.tabbar button:active{transform:scale(.92);background:rgba(255,255,255,.12)}
.tabbar button.act{background:linear-gradient(135deg,var(--red2),var(--red));box-shadow:0 6px 18px rgba(186,6,11,.6)}
.tabbar button[disabled]{opacity:.35}

.card{border-radius:22px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:6px 0;line-height:1.85;font-size:14px}
.mut{color:var(--mut)}
.sec-head{display:flex;gap:12px;align-items:center;margin:2px 2px 14px}
.num{min-width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:800 22px Arial;background:linear-gradient(135deg,var(--red2),var(--red));box-shadow:0 8px 22px rgba(186,6,11,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.sec-head h2{margin:0;font-size:21px;font-weight:800}
.sec-head p{margin:2px 0 0;color:var(--mut);font-size:13px}
.sec-foot{text-align:center;font-size:11.5px;color:var(--mut);margin:18px 0 6px}
.sec-foot b{color:#fff}
.big-ic{font-size:40px;line-height:1;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pc{border-radius:14px;padding:10px;font-size:13px;background:rgba(255,255,255,.07)}
.pc ul{margin:6px 0 0;padding:0 16px 0 0;line-height:1.75}
.pc.pro{border:1px solid rgba(120,255,160,.3)}.pc.con{border:1px solid rgba(255,120,120,.38)}
.tag{margin-top:10px;display:inline-block;background:rgba(255,255,255,.13);border-radius:12px;padding:7px 11px;font-size:13px;line-height:1.7}
.ex{border-radius:20px;padding:14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(186,6,11,.6),rgba(186,6,11,.2));border:1px solid rgba(255,120,125,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 24px rgba(186,6,11,.25)}
.ex-t{font-weight:800;margin-bottom:6px}
.ex ul{margin:6px 0;padding:0 18px 0 0;line-height:1.95;font-size:14px}
.ex p{margin:4px 0;font-size:14px;line-height:1.8}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--st);background:rgba(255,255,255,.09);color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s;backdrop-filter:blur(10px)}
.chip:active{transform:scale(.94)}
.chip.on{background:linear-gradient(135deg,var(--red2),var(--red));border-color:transparent;box-shadow:0 6px 18px rgba(186,6,11,.6)}
.btn{border:0;color:#fff;font:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,var(--red2),var(--red));box-shadow:0 8px 22px rgba(186,6,11,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:.2s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px var(--st)}
.btn.sm{font-size:12.5px;padding:8px 13px;border-radius:13px;margin-top:6px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;direction:ltr;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--red2) var(--p,50%),rgba(255,255,255,.2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-9px;background:radial-gradient(circle at 35% 30%,#fff,#ffd9db 60%,#ff9095);border:2px solid var(--red);box-shadow:0 3px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--red2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--red)}
.ticks{display:flex;justify-content:space-between;direction:ltr;font-size:11px;color:var(--mut);margin-top:-2px}
.srow{margin:10px 0 4px}
.srow .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:700}
.srow .lbl em{font:800 20px Arial;font-style:normal;color:#fff;direction:ltr;text-shadow:0 0 12px rgba(255,61,69,.8)}

.scene{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:300/190;border:1px solid var(--st);background:#000;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.scene-in{position:absolute;inset:0}
.scene svg{width:100%;height:100%;display:block}
.noise{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");animation:grain .45s steps(3) infinite}
@keyframes grain{0%{background-position:0 0}33%{background-position:-40px 22px}66%{background-position:30px -30px}100%{background-position:0 0}}
.hud{position:absolute;bottom:8px;left:8px;direction:ltr;font:700 11px 'Courier New',monospace;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:8px;color:#fff;backdrop-filter:blur(6px)}
.mover{animation:drive 2.6s linear infinite}
@keyframes drive{from{transform:translateX(-70px)}to{transform:translateX(330px)}}

.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.14);margin:2px}
.pill.good{background:rgba(70,200,120,.3)}.pill.warn{background:rgba(255,190,60,.3)}.pill.bad{background:rgba(255,70,80,.4)}
.bar{height:10px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9095,var(--red2));border-radius:8px;transition:width .25s}
.flex{display:flex;gap:10px;align-items:center}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.t3{border-radius:14px;padding:9px 6px;text-align:center;font-size:12px;background:rgba(255,255,255,.08);border:1px solid var(--st)}
.t3 b{display:block;font-size:13.5px;margin-top:3px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tile{aspect-ratio:1;border-radius:24px;border:1px solid var(--st);color:#fff;font:inherit;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:.2s}
.tile:active{transform:scale(.93)}
.tile .ic{font-size:30px;line-height:1}
.tile .tt{font-size:12px;font-weight:700;line-height:1.25;text-align:center}
.tile .tn{position:absolute;top:7px;inset-inline-start:9px;font:800 10px Arial;color:var(--mut)}
.tile.done::after{content:'✓';position:absolute;top:5px;inset-inline-end:8px;font-size:13px;color:#7dffb0}
.tile.lab{background:linear-gradient(135deg,rgba(255,61,69,.6),rgba(186,6,11,.35))}
.hero{text-align:center}
.hero .logo-chip{display:inline-block;background:#fff;border-radius:20px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero h1{font-size:22px;margin:12px 0 4px}
.hero p{color:var(--mut);font-size:13.5px;margin:4px 0 10px}
.by{font-size:12.5px;color:var(--mut);line-height:1.7}
.by b{color:#fff;font-size:15px}
.hero-row{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;flex-wrap:wrap}
.ring{position:relative;width:54px;height:54px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:800 12px Arial}

#splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#5a050c,#14050a 60%,#3a040b);transition:opacity .6s,visibility .6s;text-align:center;padding:20px}
#splash.off{opacity:0;visibility:hidden}
#splash .card-w{background:rgba(255,255,255,.96);border-radius:30px;padding:22px 28px;box-shadow:0 20px 60px rgba(186,6,11,.6);animation:pop .8s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#splash h1{font-size:20px;margin:0}
#splash p{margin:0;color:var(--mut);font-size:13px;line-height:1.8}
.loadbar{width:140px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:#ff3d45;animation:ld 2.2s ease forwards}
@keyframes ld{to{width:100%}}
.toast{position:absolute;z-index:70;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:16px;font-size:13px;font-weight:700;transition:.3s;pointer-events:none;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%)}

.sen-stage{height:150px;display:grid;place-items:center}
.sen-rect{display:grid;place-items:center;border-radius:6px;background:linear-gradient(135deg,#ff8f94,#BA060B);box-shadow:0 0 30px rgba(255,61,69,.55);transition:width .5s cubic-bezier(.3,1.2,.4,1),height .5s cubic-bezier(.3,1.2,.4,1);font:700 11px Arial;direction:ltr;text-align:center;overflow:hidden;white-space:nowrap}
.lens-wrap{position:relative}
.cone{position:absolute;top:8px;inset-inline-start:8px;width:82px;height:58px;border-radius:12px;padding:3px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.cone svg{width:100%;height:100%}
.lensview{position:relative;aspect-ratio:300/190;border-radius:18px;overflow:hidden;border:1px solid var(--st)}
.lensview svg{width:100%;height:100%;display:block}
#lz{transition:transform .25s ease;transform-origin:150px 112px}
.part{cursor:pointer}
.part .shape{transition:.25s}
.part.on .shape{filter:drop-shadow(0 0 7px #ff3d45);stroke:#ff3d45;stroke-width:2.2}
.ray{fill:none;stroke:#ffe08a;stroke-width:1.6;stroke-dasharray:5 5;animation:flow .8s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-10}}
.stage{position:relative;aspect-ratio:300/190;border-radius:18px;overflow:hidden;border:1px solid var(--st);background:linear-gradient(#6d93cf 0%,#d4e6f7 58%,#4a6b45 58%,#2b402b 100%)}
.fo{position:absolute;transition:filter .12s}
.fo svg{width:100%;display:block}
.ruler{position:relative;height:34px;direction:ltr}
.ruler span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;text-align:center;color:var(--mut);white-space:nowrap}
.ruler span::before{content:'';display:block;width:2px;height:7px;margin:0 auto 2px;background:var(--red2)}
.frame{position:relative}
.ov{position:absolute;inset:0;pointer-events:none}
.ov svg{width:100%;height:100%}
.ov .g{display:none}.ov .g.on{display:block}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;background:rgba(255,61,69,.55);box-shadow:0 0 0 4px rgba(255,61,69,.35),0 0 20px #ff3d45;pointer-events:none;transition:.2s;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.lab-tri{display:flex;justify-content:center}
.meter{position:relative;height:16px;border-radius:10px;margin:14px 4px 6px;background:linear-gradient(90deg,#222 0%,#6a1a1d 25%,#2fbf71 50%,#d9d2c4 75%,#fff 100%);border:1px solid var(--st)}
.meter i{position:absolute;top:-8px;width:6px;height:32px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff;transform:translateX(-50%);transition:left .15s}
.mticks{display:flex;justify-content:space-between;direction:ltr;font-size:10.5px;color:var(--mut)}
.chal{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.07);margin:6px 0;font-size:13px}
.chal.ok{background:rgba(70,200,120,.25)}
.chal .st{font-size:17px}
.mode-pills{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.cast{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.07);margin:6px 0;font-size:13.5px;line-height:1.7;cursor:pointer}
.check input{width:20px;height:20px;accent-color:#ff3d45;margin-top:3px;flex:none}
.check.ok{background:rgba(70,200,120,.2)}
.qopt{display:block;width:100%;text-align:right;margin:7px 0;padding:11px 14px;border-radius:14px;border:1px solid var(--st);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:14px;cursor:pointer;transition:.2s}
.qopt:active{transform:scale(.98)}
.qopt.right{background:rgba(70,200,120,.4);border-color:#5ee59a}
.qopt.wrong{background:rgba(255,70,80,.4);border-color:#ff6c74}
.badge{text-align:center;padding:10px}
.badge .medal{font-size:56px;animation:pop .8s}
.cr{text-align:center}
.cr .logo-chip{display:inline-block;background:#fff;border-radius:20px;padding:12px 18px;margin-bottom:10px}
.cr b.name{display:block;font-size:20px;margin:4px 0;text-shadow:0 0 18px rgba(255,61,69,.8)}
.dia{width:92px;height:92px;flex:none}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<aside class="side">
  <div id="sideLogo"></div>
  <h2>أساسيات التصوير الفوتوغرافي</h2>
  <p>دليل تفاعلي من 12 قسماً بمصطلحات بسيطة، مع مختبر لمثلث التعريض. جرّب الأزرار والمنزلقات داخل الهاتف.</p>
  <div class="by glass" style="border-radius:16px;padding:12px 14px">إعداد وإشراف<br><b>الأستاذ منار المنجد</b></div>
</aside>

<div class="phone" id="phone">
  <div class="island"></div>
  <div class="screen">
    <div class="so s1"></div><div class="so s2"></div><div class="so s3"></div>
    <div class="statusbar"><span id="clk">9:41</span><span>5G ▂▄▆█ 🔋</span></div>
    <header class="appbar glass">
      <div id="barLogo"></div>
      <div class="ttl" id="barTitle">الرئيسية</div>
    </header>
    <main id="view"></main>
    <nav class="tabbar glass">
      <button id="bPrev"><span>›</span>السابق</button>
      <button id="bHome" class="act"><span>🏠</span>الرئيسية</button>
      <button id="bLab"><span>🧪</span>المختبر</button>
      <button id="bNext"><span>‹</span>التالي</button>
    </nav>
    <div class="toast glass" id="toast"></div>
    <div id="splash">
      <div class="card-w" id="splashLogo"></div>
      <h1>أساسيات التصوير الفوتوغرافي</h1>
