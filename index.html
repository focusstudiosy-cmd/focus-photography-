<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2a0307"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Focus Studio"><title>Focus Studio — تسجيل الدخول</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Tajawal','Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(900px 600px at 15% 5%,#6b060d,transparent 60%),radial-gradient(800px 600px at 90% 100%,#9a0b14,transparent 55%),#12050a;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
.o1{width:300px;height:300px;background:#BA060B;top:-60px;left:-60px}.o2{width:260px;height:260px;background:#ff3d45;bottom:-50px;right:-40px}
#lg{position:relative;width:min(380px,100%);border-radius:28px;padding:26px 22px;background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.22);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3)}
#lg[hidden]{display:none}
.chip{background:#fff;border-radius:20px;padding:12px 18px;display:flex;justify-content:center;margin:0 auto 14px;width:fit-content;direction:ltr;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.chip b{display:block;font:800 34px 'Helvetica Neue',Arial,sans-serif;color:#BA060B;letter-spacing:-.03em;line-height:1}
.chip small{display:block;font:700 10px Arial;letter-spacing:.55em;color:#BA060B;margin-top:3px}
h1{font-size:19px;text-align:center;margin:4px 0 2px}
p.s{text-align:center;color:rgba(255,255,255,.72);font-size:13px;margin:0 0 16px}
label{display:block;font-size:13px;font-weight:700;margin:10px 2px 5px}
input[type=text],input[type=password]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:15px;outline:none;direction:ltr;text-align:left}
input:focus{border-color:#ff3d45;box-shadow:0 0 0 3px rgba(255,61,69,.3)}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px}
.row input{width:18px;height:18px;accent-color:#ff3d45}
button.go{width:100%;margin-top:16px;border:0;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:14px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,#ff3d45,#BA060B);box-shadow:0 8px 22px rgba(186,6,11,.55),inset 0 1px 0 rgba(255,255,255,.35)}
button.go:disabled{opacity:.6}
button.ghost{width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:inherit;padding:11px;border-radius:14px;cursor:pointer}
#msg{min-height:20px;text-align:center;font-size:13px;color:#ffb3b6;margin-top:10px}
.by{text-align:center;font-size:12px;color:rgba(255,255,255,.7);margin-top:14px}.by b{color:#fff}
</style></head><body>
<div class="orb o1"></div><div class="orb o2"></div>
<form id="lg" hidden autocomplete="on">
<div class="chip"><svg viewBox="0 0 100 100" width="54" height="54"><path d="M50 14 A36 36 0 1 0 86 50" fill="none" stroke="#BA060B" stroke-width="9" stroke-linecap="round"/><path d="M50 32 V52 L88 14" fill="none" stroke="#d5d5da" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="68" cy="50" r="3.6" fill="#d5d5da"/></svg><div><b>FOCUS</b><small>STUDIO</small></div></div>
<h1>تسجيل الدخول</h1><p class="s">أساسيات التصوير الفوتوغرافي</p>
<label for="u">اسم المستخدم</label><input type="text" id="u" autocomplete="username" autocapitalize="none" required>
<label for="p">كلمة المرور</label><input type="password" id="p" autocomplete="current-password" required>
<div class="row"><input type="checkbox" id="sh"><label for="sh" style="margin:0;font-weight:400">إظهار كلمة المرور</label></div>
<div class="row"><input type="checkbox" id="rm" checked><label for="rm" style="margin:0;font-weight:400">تذكّرني على هذا الجهاز</label></div>
<button class="go" id="btn" type="submit">دخول</button>
<button class="ghost" id="inst" type="button" hidden>📲 ثبّت التطبيق</button>
<div id="msg"></div>
<div class="by">بإشراف <b>الأستاذ منار المنجد</b></div>
</form>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=a=>{let s='';new Uint8Array(a).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
async function keyFrom(user,pass){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\u0000'+pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function decryptWith(key){const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));return new TextDecoder().decode(buf)}
async function unlock(user,pass){const k=await keyFrom(user,pass);const html=await decryptWith(k);return{html,k}}
//FUNCS_END
function show(html){document.open();document.write(html);document.close()}
const $=id=>document.getElementById(id);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__ip=e;if($('inst'))$('inst').hidden=false});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
$('sh').onchange=()=>{$('p').type=$('sh').checked?'text':'password'};
$('inst').onclick=async()=>{if(window.__ip){window.__ip.prompt();await window.__ip.userChoice}};
$('lg').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='';
 if(!(window.crypto&&crypto.subtle)){$('msg').textContent='يتطلب فتح التطبيق عبر رابط HTTPS.';return}
 $('btn').disabled=true;$('btn').textContent='جارٍ التحقق…';
 try{const r=await unlock($('u').value,$('p').value);
  if($('rm').checked){try{localStorage.setItem('fsk',b64(await crypto.subtle.exportKey('raw',r.k)))}catch(x){}}
  show(r.html)}
 catch(err){await new Promise(r=>setTimeout(r,900));$('msg').textContent='اسم المستخدم أو كلمة المرور غير صحيحة.';$('btn').disabled=false;$('btn').textContent='دخول'}});
(async()=>{let s=null;try{s=localStorage.getItem('fsk')}catch(e){}
 if(s&&window.crypto&&crypto.subtle){try{const k=await crypto.subtle.importKey('raw',u8(s),'AES-GCM',true,['decrypt']);show(await decryptWith(k));return}catch(e){try{localStorage.removeItem('fsk')}catch(x){}}}
 $('lg').hidden=false})();
})();
